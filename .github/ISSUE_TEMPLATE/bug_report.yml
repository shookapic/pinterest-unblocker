name: Bug report
description: Report an overlay, scrolling, image-saving, or compatibility problem.
title: "bug: "
body:
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 154 on Windows 11
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Affected public Pinterest URL
      description: Do not include private board links or account information.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include whether you were logged in and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Actual result
      description: Include relevant console errors or screenshots with personal information removed.
    validations:
      required: true
